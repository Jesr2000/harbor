<title>Harbor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: one lively column for a phone. A little lighthouse-lantern creature (Pip) hosts the app, a boat sails toward real places you choose, and sound and light scenes give hard moments somewhere soft to land. */
:root{
  --bg:#E9EFF0;
  --surface:#F6F9F9;
  --surface2:#DCE6E7;
  --ink:#14262D;
  --muted:#4F6870;
  --line:#C5D4D6;
  --accent:#1F6F6B;
  --on-accent:#FFFFFF;
  --lamp:#E3A64B;
  --lamp-soft:#F3E3C4;
  --lamp-ink:#4A3208;
  --help-bg:#F4E1DA;
  --help-ink:#6B2A1E;
  --pop:#D9644A;
  --pop-soft:#F6DDD5;
  --pop-ink:#5A2318;
  --sky-soft:#D5E8F5;
  --sky-ink:#16324A;
  --sea-a:#2A8C93;
  --sea-b:#1B6A76;
  --sea-c:#0F4D5C;
  --cloud:#FFFFFF;
  --pip:#3FA7A0;
  --pip-belly:#C4EBE5;
  --glow:#FFC857;
  --font-display:"Young Serif",Georgia,"Times New Roman",serif;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1B20;--surface:#15262C;--surface2:#1D3239;--ink:#E4EEF0;--muted:#9DB5BB;--line:#2A444C;
    --accent:#5FC1B8;--on-accent:#07191B;--lamp:#E9B866;--lamp-soft:#3A2E17;--lamp-ink:#F3DDB0;
    --help-bg:#3A211B;--help-ink:#F2C5B8;--pop:#F08A70;--pop-soft:#3B2620;--pop-ink:#F6C9BB;
    --sky-soft:#1A3347;--sky-ink:#BFDDF2;--sea-a:#1F6C78;--sea-b:#154F5E;--sea-c:#0B3342;--cloud:#B9CCD6;
    --pip:#4CC0B7;--pip-belly:#CFEFEA;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1B20;--surface:#15262C;--surface2:#1D3239;--ink:#E4EEF0;--muted:#9DB5BB;--line:#2A444C;
  --accent:#5FC1B8;--on-accent:#07191B;--lamp:#E9B866;--lamp-soft:#3A2E17;--lamp-ink:#F3DDB0;
  --help-bg:#3A211B;--help-ink:#F2C5B8;--pop:#F08A70;--pop-soft:#3B2620;--pop-ink:#F6C9BB;
  --sky-soft:#1A3347;--sky-ink:#BFDDF2;--sea-a:#1F6C78;--sea-b:#154F5E;--sea-c:#0B3342;--cloud:#B9CCD6;
  --pip:#4CC0B7;--pip-belly:#CFEFEA;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-block:0 108px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.shell{max-width:520px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:22px;letter-spacing:.01em}
.mark svg{width:26px;height:26px;color:var(--accent)}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill.help{background:var(--help-bg);color:var(--help-ink);border-color:transparent}
.pill.sound{background:var(--sky-soft);color:var(--sky-ink);border-color:transparent}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{display:block;width:3px;background:currentColor;border-radius:2px;height:100%;transform-origin:bottom;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
button{font-family:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:20px;padding-top:8px}
.view>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}
.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(6){animation-delay:.25s}.view>*:nth-child(7){animation-delay:.3s}.view>*:nth-child(n+8){animation-delay:.35s}
h1.display{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:18px;max-width:34em}
p{margin:0}
.small{font-size:15px;color:var(--muted)}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.lamp{background:var(--lamp-soft);border-color:transparent;color:var(--lamp-ink)}
.card.helpcard{background:var(--help-bg);border-color:transparent;color:var(--help-ink)}
.card.pop{background:var(--pop-soft);border-color:transparent;color:var(--pop-ink)}
.card.sky{background:var(--sky-soft);border-color:transparent;color:var(--sky-ink)}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s ease}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;color:var(--muted);border-color:var(--line);font-weight:600}
.btn.popbtn{background:var(--pop);border-color:var(--pop);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.row{display:flex;flex-wrap:wrap;gap:10px}
/* hero */
.hero-wrap{position:relative;padding-top:6px}
.hero{height:158px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--sky-a,#8EC9E8),var(--sky-b,#D8F0F7))}
.hero svg{width:100%;height:100%;display:block}
.wv1{animation:waveL 14s linear infinite}
.wv2{animation:waveR 10s linear infinite}
.wv3{animation:waveL 7s linear infinite}
.boat{animation:rock 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sunpulse{animation:glow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cloud{animation:drift 11s ease-in-out infinite alternate}
.tw{animation:twinkle 3s ease-in-out infinite}
.pip{position:absolute;right:10px;bottom:-6px;width:104px;cursor:pointer;touch-action:manipulation}
.pip.big{position:relative;right:auto;bottom:auto;width:170px;margin:0 auto}
.pip-art{animation:bob 3.4s ease-in-out infinite;transform-origin:bottom center}
.pip-art.squish{animation:squish .5s ease}
.pip-svg{width:100%;display:block;overflow:visible}
.pip-eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.lamp-glow{animation:glow 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wing-l,.wing-r{transform-box:fill-box;transform-origin:50% 20%}
.wing-l{animation:flapL 3s ease-in-out infinite}.wing-r{animation:flapR 3s ease-in-out infinite}
.bubble-speech{position:absolute;right:calc(100% - 96px);bottom:96%;width:max-content;max-width:min(240px,64vw);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:600;line-height:1.35;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.pip.big .bubble-speech{right:auto;left:50%;transform:translateX(-50%);bottom:102%}
.bubble-speech.show{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
/* moods */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;min-height:92px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;min-width:0;transition:transform .2s cubic-bezier(.2,1.4,.4,1),background .2s}
.mood svg{width:30px;height:42px;color:var(--ink)}
.mood:active{transform:scale(.92)}
.mood.on{border-color:var(--accent);background:var(--surface2);color:var(--ink);transform:translateY(-4px) scale(1.04)}
.water{fill:var(--accent);opacity:.55}
.mood.on .water{animation:slosh 2s ease-in-out infinite}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{resize:vertical;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{border-color:var(--accent);background:var(--surface2)}
.step-text{font-family:var(--font-display);font-size:26px;line-height:1.25;text-wrap:balance}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .body{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.entry-head{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600}
.entry-head svg{width:14px;height:20px;color:var(--ink)}
.rm{min-height:44px;min-width:44px;border:0;background:transparent;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:10px;fill:var(--muted)}
.chart .bar{fill:var(--accent)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .dot{fill:var(--line)}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:112px;padding:14px;border-radius:18px;border:0;text-align:left;cursor:pointer;color:var(--ink);background:var(--surface2);animation:bob 4.5s ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .15s}
.tile:active{transform:scale(.95)}
.tile strong{font-family:var(--font-display);font-weight:400;font-size:19px}
.tile span.s{font-size:14px;opacity:.85;line-height:1.3}
.tile svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t-step{background:var(--surface2)}
.t-jar{background:var(--lamp-soft);color:var(--lamp-ink)}
.t-calm{background:var(--sky-soft);color:var(--sky-ink)}
.t-joy{background:var(--pop-soft);color:var(--pop-ink)}
/* voyage */
.route{width:100%;height:auto;display:block}
.bar-outer{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar-inner{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--lamp));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.miles{font-variant-numeric:tabular-nums;font-weight:700}
.postcard{position:relative;margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.postcard svg{width:100%;height:auto;display:block}
.postcard .cap{position:absolute;left:10px;bottom:8px;background:rgba(10,25,32,.62);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.stamp{position:absolute;right:10px;top:10px;transform:rotate(8deg);border:2.5px solid #fff;color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(217,100,74,.85);animation:stampin .6s cubic-bezier(.2,1.6,.4,1) both}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc-card{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;color:var(--ink);min-width:0;transition:transform .15s}
.pc-card:active{transform:scale(.97)}
.pc-card .postcard{border-radius:10px}
.pc-card strong{font-size:15px;line-height:1.25}
.pc-card .small{font-size:13px}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;text-align:left;cursor:pointer}
.check .box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.check[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check[aria-checked="true"] .t{text-decoration:line-through;opacity:.7}
/* gift */
.chest{width:120px;margin:0 auto;display:block;overflow:visible}
.chest.ready{animation:wiggle 2.2s ease-in-out infinite}
.chest .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.chest.open .lid{transform:rotate(-38deg)}
.chest.locked{filter:grayscale(.8) opacity(.6)}
.spark{animation:twinkle 1.6s ease-in-out infinite}
/* calm */
.breath-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 0}
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--surface),var(--surface2));border:2px solid var(--accent);transform:scale(.6);transition-property:transform;transition-timing-function:ease-in-out;box-shadow:0 0 0 0 var(--accent)}
.breath.big{transform:scale(1)}
.breath-label{font-family:var(--font-display);font-size:22px;min-height:1.5em;text-align:center}
ol.ground{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.layer{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.layer:first-of-type{border-top:0}
.layer .nm{font-weight:700}
.layer input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);min-height:32px}
.switch{width:56px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scene-btn{display:flex;flex-direction:column;justify-content:flex-end;min-height:116px;padding:10px;border-radius:16px;border:0;color:#fff;font-weight:700;font-size:15px;text-align:left;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.scene-btn:active{transform:scale(.95)}
.scene-btn.sc1{background:linear-gradient(#0a1c34,#0f4a63)}
.scene-btn.sc2{background:linear-gradient(#06142a,#1c6f6a 60%,#6a4aa8)}
.scene-btn.sc3{background:linear-gradient(#07140f,#17483b)}
.scene-btn i{position:absolute;border-radius:50%;background:#fff;opacity:.8;animation:twinkle 3s ease-in-out infinite}
.progress-prompt{font-family:var(--font-display);font-size:23px;line-height:1.3;min-height:4.2em;text-wrap:balance}
.scene{position:fixed;inset:0;z-index:50;background:#050d1f;animation:fadein .6s ease both}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene-line{position:absolute;left:0;right:0;top:20%;text-align:center;color:#fff;font-family:var(--font-display);font-size:24px;padding:0 28px;text-shadow:0 2px 14px rgba(0,0,0,.5);transition:opacity 1.6s ease;opacity:0;text-wrap:balance}
.scene-line.on{opacity:.95}
.scene-x{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;font-size:16px;font-weight:700;cursor:pointer;z-index:2}
.scene-sound{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
/* joy */
.joy-out{min-height:84px}
.wheel-wrap{position:relative;width:min(280px,78vw);aspect-ratio:1;margin:0 auto}
.wheel{width:100%;height:100%;display:block;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.wheel text{font-family:var(--font-body);font-size:9px;font-weight:800;fill:#fff}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink)}
.bubble-room{position:relative;height:280px;border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky-soft),var(--surface2));touch-action:manipulation}
.bubble{position:absolute;bottom:-90px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,255,255,.18) 40%,rgba(120,190,230,.28));animation:floatUp var(--dur,8s) linear forwards;cursor:pointer;padding:0}
.bubble.popping{animation:burst .35s ease-out forwards}
.pw{position:absolute;font-weight:800;color:var(--sky-ink);pointer-events:none;animation:wordup .9s ease-out forwards;font-size:18px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;overflow-wrap:anywhere}
.helpline{display:flex;flex-direction:column;gap:8px}
.helpline h2{font-size:19px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:background .2s,color .2s,transform .15s;min-width:0}
.nav button:active{transform:scale(.92)}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--surface2)}
.nav button[aria-current="page"] svg{transform:translateY(-2px) scale(1.12)}
.live{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;z-index:7;animation:pop .3s ease both}
.live:empty{display:none}
.banner{background:var(--lamp-soft);color:var(--lamp-ink);border-radius:12px;padding:12px 14px;font-size:15px}
.tally{font-variant-numeric:tabular-nums}
a{color:var(--accent);font-weight:600}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes rock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
@keyframes waveL{from{transform:translateX(0)}to{transform:translateX(-400px)}}
@keyframes waveR{from{transform:translateX(-400px)}to{transform:translateX(0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}

<script>
(function(){
"use strict";

/* ================= storage ================= */
var KEY="harbor.v1";
var storageOk=true;
var cleanup=null;
var current="today";

function fresh(){
  return {v:2,intro:false,entries:[],steps:[],jar:[],days:{},miles:0,dest:null,base:0,arrived:{},goals:{},news:null,gift:{day:"",item:null},fx:true,still:false};
}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+"-"+(d.getMonth()<9?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate();}
function normalize(d){
  var o=fresh();
  if(!d||typeof d!=="object")return o;
  o.intro=!!d.intro;
  if(Array.isArray(d.entries)){
    o.entries=d.entries.filter(function(x){return x&&typeof x.t==="number"&&x.mood>=1&&x.mood<=5;})
      .map(function(x){return {id:String(x.id||x.t),t:x.t,mood:Math.round(x.mood),note:typeof x.note==="string"?x.note:""};});
  }
  if(Array.isArray(d.steps)){
    o.steps=d.steps.filter(function(x){return x&&typeof x.t==="number";})
      .map(function(x){return {t:x.t,text:typeof x.text==="string"?x.text:""};});
  }
  if(Array.isArray(d.jar)){
    o.jar=d.jar.filter(function(x){return x&&typeof x.t==="number"&&typeof x.text==="string"&&x.text;})
      .map(function(x){return {id:String(x.id||x.t),t:x.t,text:x.text};});
  }
  if(d.days&&typeof d.days==="object"){Object.keys(d.days).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k))o.days[k]=1;});}
  o.entries.forEach(function(e){o.days[dayKey(e.t)]=1;});
  o.steps.forEach(function(e){o.days[dayKey(e.t)]=1;});
  o.jar.forEach(function(e){o.days[dayKey(e.t)]=1;});
  o.miles=typeof d.miles==="number"&&d.miles>=0?Math.floor(d.miles):0;
  o.base=typeof d.base==="number"&&d.base>=0?Math.floor(d.base):0;
  o.dest=typeof d.dest==="string"?d.dest:null;
  if(d.arrived&&typeof d.arrived==="object"){Object.keys(d.arrived).forEach(function(k){if(typeof d.arrived[k]==="number")o.arrived[k]=d.arrived[k];});}
  if(d.goals&&typeof d.goals==="object"){Object.keys(d.goals).forEach(function(k){if(Array.isArray(d.goals[k]))o.goals[k]=d.goals[k].map(function(b){return !!b;});});}
  o.news=typeof d.news==="string"?d.news:null;
  if(d.gift&&typeof d.gift==="object"&&typeof d.gift.day==="string"){
    o.gift={day:d.gift.day,item:d.gift.item&&typeof d.gift.item.text==="string"?{kind:String(d.gift.item.kind||"Gift"),text:d.gift.item.text}:null};
  }
  o.fx=d.fx!==false;
  o.still=!!d.still;
  return o;
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw)return normalize(JSON.parse(raw));
  }catch(e){}
  return fresh();
}
var S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;}
  catch(e){storageOk=false;}
}
save();
function applyStill(){document.documentElement.setAttribute("data-still",S.still?"1":"0");}
applyStill();

/* ================= helpers ================= */
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      var v=attrs[k];
      if(v===false||v==null)return;
      if(k==="class")e.className=v;
      else if(k==="html")e.innerHTML=v;
      else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),v);
      else if(v===true)e.setAttribute(k,"");
      else e.setAttribute(k,v);
    });
  }
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){
      var c=kids[j];
      if(c==null||c===false)continue;
      e.append(c.nodeType?c:document.createTextNode(String(c)));
    }
  }
  return e;
}
function fmtDate(ts){return new Date(ts).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});}
function fmtTime(ts){return new Date(ts).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr,not){
  if(arr.length===1)return arr[0];
  var x;do{x=arr[Math.floor(Math.random()*arr.length)];}while(x===not);
  return x;
}
function rng(seed){
  return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}
function reduced(){
  if(S.still)return true;
  try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}
}
var liveTimer=null;
function say(msg){
  var el=document.getElementById("live");
  el.textContent=msg;
  clearTimeout(liveTimer);
  liveTimer=setTimeout(function(){el.textContent="";},4200);
}
function copyText(text,okMsg){
  function fail(){say("Could not copy. Select the text and copy it by hand.");}
  try{navigator.clipboard.writeText(text).then(function(){say(okMsg||"Copied");},fail);}catch(e){fail();}
}
function markAct(){S.days[dayKey(Date.now())]=1;}
function daysShownUp(){return Object.keys(S.days).length;}

var CRISIS=/(kill myself|end (it all|my life)|suicid|want to die|wanna die|don'?t want to (be here|live)|hurt myself|self[- ]?harm|me tuer|en finir|mourir)/i;

function confetti(n){
  if(reduced())return;
  var cv=h("canvas",{class:"confetti","aria-hidden":"true"});
  document.body.append(cv);
  var w=cv.width=window.innerWidth,hh=cv.height=window.innerHeight;
  var c=null;try{c=cv.getContext("2d");}catch(e){}
  if(!c){cv.remove();return;}
  var cols=["#E3A64B","#D9644A","#2F9E96","#7BB6E8","#B58AE6","#F2D16B"];
  var ps=[],i;
  for(i=0;i<(n||120);i++){ps.push({x:w/2+(Math.random()-.5)*w*.4,y:hh*.55,vx:(Math.random()-.5)*10,vy:-Math.random()*13-4,r:Math.random()*5+3,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4});}
  var t0=performance.now();
  (function frame(now){
    var dt=now-t0;
    c.clearRect(0,0,w,hh);
    ps.forEach(function(p){
      p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.c;c.globalAlpha=Math.max(0,1-dt/2400);
      c.fillRect(-p.r,-p.r/2,p.r*2,p.r);c.restore();
    });
    if(dt<2400)requestAnimationFrame(frame);else cv.remove();
  })(t0);
}

/* ================= audio engine ================= */
var AE={ctx:null,master:null,noise:{},layers:{},vol:{},sleepAt:0,sleepT:null,fadeT:null};
function ac(){
  if(!AE.ctx){
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    try{AE.ctx=new C();}catch(e){return null;}
    var comp=AE.ctx.createDynamicsCompressor();
    AE.master=AE.ctx.createGain();AE.master.gain.value=0.85;
    AE.master.connect(comp);comp.connect(AE.ctx.destination);
  }
  if(AE.ctx.state==="suspended"){try{AE.ctx.resume();}catch(e){}}
  return AE.ctx;
}
function noiseBuf(ctx,type){
  if(AE.noise[type])return AE.noise[type];
  var len=Math.floor(ctx.sampleRate*4),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0,i,w;
  for(i=0;i<len;i++){
    w=Math.random()*2-1;
    if(type==="white"){d[i]=w;}
    else if(type==="pink"){
      b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.153852;
      b3=0.8665*b3+w*0.3104856;b4=0.55*b4+w*0.5329522;b5=-0.7616*b5-w*0.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926;
    }else{last=(last+0.02*w)/1.02;d[i]=last*3.5;}
  }
  AE.noise[type]=buf;
  return buf;
}
function loopNoise(ctx,type){
  var s=ctx.createBufferSource();s.buffer=noiseBuf(ctx,type);s.loop=true;s.start();return s;
}
function lfo(ctx,freq,depth,param){
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=freq;g.gain.value=depth;o.connect(g);g.connect(param);o.start();
  return o;
}
function repeat(fn,minMs,maxMs,firstMs){
  var t=null,dead=false;
  function go(){if(dead)return;fn();t=setTimeout(go,rnd(minMs,maxMs));}
  t=setTimeout(go,firstMs==null?rnd(minMs,maxMs):firstMs);
  return {stop:function(){dead=true;clearTimeout(t);}};
}
function voice(ctx,dest,freq,dur,type,vol,delay){
  var t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);
}
var PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
var LAYERS=[
  {id:"ocean",name:"Ocean waves",desc:"Slow swells rolling in",def:.7,make:function(ctx,out){
    var n=loopNoise(ctx,"brown"),lp=ctx.createBiquadFilter(),g=ctx.createGain();
    lp.type="lowpass";lp.frequency.value=650;g.gain.value=0.55;
    n.connect(lp);lp.connect(g);g.connect(out);
    var l1=lfo(ctx,0.085,0.3,g.gain),l2=lfo(ctx,0.085,380,lp.frequency);
    var n2=loopNoise(ctx,"pink"),bp=ctx.createBiquadFilter(),g2=ctx.createGain();
    bp.type="bandpass";bp.frequency.value=2200;g2.gain.value=0.05;
    n2.connect(bp);bp.connect(g2);g2.connect(out);
    var l3=lfo(ctx,0.085,0.045,g2.gain);
    return function(){[n,n2,l1,l2,l3].forEach(function(x){try{x.stop();}catch(e){}});};
  }},
  {id:"rain",name:"Soft rain",desc:"Steady rain on leaves",def:.65,make:function(ctx,out){
    var n=loopNoise(ctx,"pink"),hp=ctx.createBiquadFilter(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
    hp.type="highpass";hp.frequency.value=900;lp.type="lowpass";lp.frequency.value=9000;g.gain.value=0.5;
    n.connect(hp);hp.connect(lp);lp.connect(g);g.connect(out);
    var n2=loopNoise(ctx,"brown"),lp2=ctx.createBiquadFilter(),g2=ctx.createGain();
    lp2.type="lowpass";lp2.frequency.value=300;g2.gain.value=0.22;
    n2.connect(lp2);lp2.connect(g2);g2.connect(out);
    var drops=repeat(function(){voice(ctx,out,rnd(1400,4200),0.05,"sine",rnd(0.012,0.03));},70,260,100);
    return function(){drops.stop();[n,n2].forEach(function(x){try{x.stop();}catch(e){}});};
  }},
  {id:"night",name:"Night crickets",desc:"A warm night with a light breeze",def:.55,make:function(ctx,out){
    var n=loopNoise(ctx,"pink"),lp=ctx.createBiquadFilter(),g=ctx.createGain();
    lp.type="lowpass";lp.frequency.value=380;g.gain.value=0.1;
    n.connect(lp);lp.connect(g);g.connect(out);
    var l=lfo(ctx,0.12,0.06,g.gain);
    function chirp(base){
      return repeat(function(){
        var k,f=base+rnd(-120,120);
        for(k=0;k<3;k++)voice(ctx,out,f,0.045,"sine",0.016,k*0.07);
      },700,1500);
    }
    var c1=chirp(4300),c2=chirp(4700);
    return function(){c1.stop();c2.stop();[n,l].forEach(function(x){try{x.stop();}catch(e){}});};
  }},
  {id:"chimes",name:"Wind chimes",desc:"Gentle notes drifting by",def:.45,make:function(ctx,out){
    var r=repeat(function(){
      var f=pick(PENTA);
      voice(ctx,out,f,3.6,"sine",0.07);voice(ctx,out,f*2,2.2,"triangle",0.015);
    },1800,5200,400);
    return function(){r.stop();};
  }},
  {id:"bowl",name:"Singing bowl",desc:"A long, soft ring now and then",def:.5,make:function(ctx,out){
    var r=repeat(function(){
      var f=pick([196,220,246.94]);
      voice(ctx,out,f,9,"sine",0.12);voice(ctx,out,f*2.76,6,"sine",0.04);voice(ctx,out,f*5.4,3,"sine",0.015);
    },13000,19000,300);
    return function(){r.stop();};
  }},
  {id:"pad",name:"Lullaby pad",desc:"A slow, warm hum",def:.4,make:function(ctx,out){
    var lp=ctx.createBiquadFilter(),g=ctx.createGain(),oscs=[],freqs=[130.81,196,293.66,329.63];
    lp.type="lowpass";lp.frequency.value=900;g.gain.value=0.07;
    lp.connect(g);g.connect(out);
    freqs.forEach(function(f,i){
      var o=ctx.createOscillator(),og=ctx.createGain();
      o.type="sine";o.frequency.value=f;o.detune.value=(i-1.5)*4;og.gain.value=0.5;
      o.connect(og);og.connect(lp);o.start();oscs.push(o);
    });
    var l=lfo(ctx,0.06,0.035,g.gain);oscs.push(l);
    return function(){oscs.forEach(function(x){try{x.stop();}catch(e){}});};
  }}
];
var LAYER={};LAYERS.forEach(function(l){LAYER[l.id]=l;});
function layerOn(id){return !!AE.layers[id];}
function anyPlaying(){return Object.keys(AE.layers).length>0;}
function startLayer(id,vol){
  var ctx=ac();
  if(!ctx){say("Sound is not available in this browser");return false;}
  if(AE.layers[id])return true;
  if(AE.master)AE.master.gain.setTargetAtTime(0.85,ctx.currentTime,0.05);
  var v=vol!=null?vol:(AE.vol[id]!=null?AE.vol[id]:LAYER[id].def);
  AE.vol[id]=v;
  var g=ctx.createGain();g.gain.value=0.0001;g.connect(AE.master);
  g.gain.setTargetAtTime(v,ctx.currentTime,0.6);
  var stop=LAYER[id].make(ctx,g);
  AE.layers[id]={g:g,stop:stop};
  updateSoundPill();
  return true;
}
function stopLayer(id){
  var L=AE.layers[id];if(!L)return;
  var ctx=AE.ctx;
  try{L.g.gain.setTargetAtTime(0.0001,ctx.currentTime,0.25);}catch(e){}
  delete AE.layers[id];
  setTimeout(function(){try{L.stop();L.g.disconnect();}catch(e){}},1400);
  updateSoundPill();
}
function stopAll(){Object.keys(AE.layers).forEach(stopLayer);}
function setVol(id,v){
  AE.vol[id]=v;
  var L=AE.layers[id];
  if(L&&AE.ctx)L.g.gain.setTargetAtTime(v,AE.ctx.currentTime,0.08);
}
function setSleep(min){
  clearTimeout(AE.sleepT);clearTimeout(AE.fadeT);
  if(!min){AE.sleepAt=0;return;}
  AE.sleepAt=Date.now()+min*60000;
  AE.sleepT=setTimeout(function(){
    if(AE.ctx&&AE.master)AE.master.gain.setTargetAtTime(0.0001,AE.ctx.currentTime,3);
    AE.fadeT=setTimeout(function(){stopAll();AE.sleepAt=0;},10000);
  },min*60000);
}
function updateSoundPill(){document.getElementById("btnSound").hidden=!anyPlaying();}
function tone(freq,dur,type,vol,delay){
  if(!S.fx)return;
  var ctx=ac();if(!ctx)return;
  voice(ctx,AE.master,freq,dur,type,vol,delay);
}
function sfx(k){
  var i;
  if(k==="boop"){tone(380,0.16,"sine",0.12);tone(560,0.12,"sine",0.08,0.05);}
  else if(k==="pop"){tone(rnd(650,900),0.07,"triangle",0.1);tone(1200,0.05,"sine",0.05,0.02);}
  else if(k==="done"){[523,659,784].forEach(function(f,j){tone(f,0.5,"sine",0.1,j*0.09);});}
  else if(k==="sparkle"){[1047,1319,1568,2093].forEach(function(f,j){tone(f,0.6,"sine",0.06,j*0.07);});}
  else if(k==="fanfare"){[523,659,784,1047].forEach(function(f,j){tone(f,0.9,"triangle",0.1,j*0.14);});}
  else if(k==="bowl"){tone(220,5,"sine",0.1);tone(607,3,"sine",0.03);}
  else if(k==="tick"){tone(900,0.05,"square",0.025);}
  i=0;
}

  c.globalAlpha=1;

function openScene(kind,soundIds){
  closeScene();
  var ov=h("div",{class:"scene",role:"dialog","aria-label":"Calming scene"});
  var cv=h("canvas");
  var line=h("p",{class:"scene-line","aria-live":"off"},"");
  var x=h("button",{class:"scene-x",type:"button","aria-label":"Close scene",onclick:closeScene},"Close");
  ov.append(cv,line,x);
  if(soundIds){
    var sb=h("button",{class:"scene-sound",type:"button"},anyPlaying()?"Stop sound":"Play soft sound");
    sb.addEventListener("click",function(){
      if(anyPlaying()){stopAll();sb.textContent="Play soft sound";}
      else{soundIds.forEach(function(id){startLayer(id);});sb.textContent="Stop sound";}
    });
    ov.append(sb);
  }
  document.body.append(ov);
  var ctx=null;try{ctx=cv.getContext("2d");}catch(e){}
  var D=DRAW[kind],st=null,w=0,hgt=0,t0=performance.now();
  function size(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    w=ov.clientWidth||window.innerWidth;hgt=ov.clientHeight||window.innerHeight;
    cv.width=Math.floor(w*dpr);cv.height=Math.floor(hgt*dpr);
    if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
    st=D.init(w,hgt);
    if(reduced()&&ctx)D.draw(ctx,w,hgt,2,st);
  }
  size();
  var still=reduced();
  var s={ov:ov,raf:0,iv:0,onResize:size};
  SCENE=s;
  window.addEventListener("resize",size);
  function frame(now){
    if(SCENE!==s)return;
    if(ctx)D.draw(ctx,w,hgt,(now-t0)/1000,st);
    s.raf=requestAnimationFrame(frame);
  }
  if(!still)s.raf=requestAnimationFrame(frame);
  var li=0;
  function nextLine(){
    line.classList.remove("on");
    setTimeout(function(){line.textContent=SCENE_LINES[li%SCENE_LINES.length];li++;line.classList.add("on");},900);
  }
  nextLine();
  s.iv=setInterval(nextLine,8000);
}

/* ================= progress & rewards ================= */
function earn(n){
  S.miles+=n;
  markAct();
  checkArrival();
  save();
}
function checkArrival(){
  if(!S.dest)return;
  var p=PLACE[S.dest];
  if(p&&S.miles-S.base>=p.cost){
    S.arrived[p.id]=Date.now();S.news=p.id;S.dest=null;
    setTimeout(function(){confetti(160);sfx("fanfare");say("You reached "+p.name+"! See Voyage.");},350);
  }
}
function progress(){
  var p=S.dest?PLACE[S.dest]:null;
  if(!p)return {p:null,got:0,frac:0};
  var got=Math.max(0,S.miles-S.base);
  return {p:p,got:got,frac:Math.min(1,got/p.cost)};
}
function giftItem(){
  var t=Math.floor(Math.random()*5);
  if(t===0)return {kind:"Joke",text:pick(JOKES)};
  if(t===1)return {kind:"Kind note",text:pick(KIND)};
  if(t===2)return {kind:"Fun fact",text:pick(FACTS)};
  if(t===3)return {kind:"Silly dare",text:pick(DARES)};
  var p=pick(PLACES);return {kind:"Place to dream about",text:p.name+". "+p.fact};
}

function tideChart(){
  var W=320,H=134,L=48,B=24,T=8,R=6;
  var plotH=H-T-B,bw=(W-L-R)/14;
  var now=new Date();now.setHours(0,0,0,0);
  var by={};
  S.entries.forEach(function(e){var k=dayKey(e.t);(by[k]=by[k]||[]).push(e.mood);});
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Average mood for each of the last 14 days">',lv,i;
  for(lv=1;lv<=5;lv++){var gy=H-B-(lv/5)*plotH;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'"/>';}
  s+='<text x="'+(L-6)+'" y="'+(H-B-(1/5)*plotH+3).toFixed(1)+'" text-anchor="end">Heavy</text>';
  s+='<text x="'+(L-6)+'" y="'+(H-B-plotH+3).toFixed(1)+'" text-anchor="end">Bright</text>';
  for(i=0;i<14;i++){
    var d=new Date(now);d.setDate(d.getDate()-(13-i));
    var arr=by[dayKey(d.getTime())],x=L+i*bw+bw*0.2,ww=bw*0.6;
    if(arr&&arr.length){
      var avg=arr.reduce(function(a,b){return a+b;},0)/arr.length,bh=(avg/5)*plotH;
      s+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+(H-B-bh).toFixed(1)+'" width="'+ww.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2"/>';
    }else{s+='<circle class="dot" cx="'+(x+ww/2).toFixed(1)+'" cy="'+(H-B-3)+'" r="2.5"/>';}
    s+='<text x="'+(x+ww/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+d.toLocaleDateString(undefined,{weekday:"narrow"})+'</text>';
  }
  return s+'</svg>';
}
function insight(){
  if(S.entries.length<8)return "Patterns show up after about eight check-ins. Go at your own pace.";
  var sums=[0,0,0,0,0,0,0],cnt=[0,0,0,0,0,0,0],i;
  S.entries.forEach(function(e){var wd=new Date(e.t).getDay();sums[wd]+=e.mood;cnt[wd]++;});
  var lo=-1,hi=-1,loV=9,hiV=0;
  for(i=0;i<7;i++){
    if(cnt[i]<2)continue;
    var a=sums[i]/cnt[i];
    if(a<loV){loV=a;lo=i;}
    if(a>hiV){hiV=a;hi=i;}
  }
  if(lo<0||lo===hi)return "No clear weekly pattern yet. That is normal.";
  return "So far, "+WEEKDAYS[lo]+" tend to feel the heaviest (about "+loV.toFixed(1)+" out of 5) and "+WEEKDAYS[hi]+" the lightest (about "+hiV.toFixed(1)+"). It is a pattern to plan around, not a verdict.";
}

    try{parsed=JSON.parse(raw);}catch(e){say("That does not look like a Harbor backup");return;}

/* ================= router ================= */
var VIEWS={today:viewToday,steps:viewSteps,jar:viewJar,voyage:viewVoyage,calm:viewCalm,joy:viewJoy,me:viewMe,help:viewHelp};
var PARENT={steps:"today",jar:"today",help:"",place:"voyage"};
function resolve(name){
  if(name.indexOf("place-")===0&&PLACE[name.slice(6)])return name;
  return VIEWS[name]?name:"today";
}
function route(name){
  name=resolve(name);
  current=name;
  if(cleanup){cleanup();cleanup=null;}
  var app=document.getElementById("app");
  var view=name.indexOf("place-")===0?viewPlace(name.slice(6)):VIEWS[name]();
  app.replaceChildren(view);
  var key=name.indexOf("place-")===0?"voyage":(name in PARENT?PARENT[name]:name);
  document.querySelectorAll(".nav button").forEach(function(b){
    b.setAttribute("aria-current",b.dataset.view===key?"page":"false");
  });
  try{window.scrollTo(0,0);}catch(e){}
}
function go(name){
  closeScene();
  current=resolve(name);
  try{if(location.hash!=="#"+name)location.hash=name;}catch(e){}
  route(name);
}
window.addEventListener("hashchange",function(){
  var n=resolve((location.hash||"").replace("#",""));
  if(n!==current){closeScene();route(n);}
});
document.querySelectorAll(".nav button").forEach(function(b){
  b.addEventListener("click",function(){go(b.dataset.view);});
});
document.getElementById("btnHelp").addEventListener("click",function(){go("help");});
document.getElementById("btnSound").addEventListener("click",function(){go("calm");});

route((location.hash||"").replace("#","")||"today");
})();
